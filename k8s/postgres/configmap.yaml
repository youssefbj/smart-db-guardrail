apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: database
  labels:
    app: postgres
  annotations:
    ai-validator/status: "APPROUVE"
    ai-validator/score: "85"
    ai-validator/model: "phi3:mini"
data:
  postgresql.conf: |
    listen_addresses = 'localhost'
    port = 5432
    max_connections = 100
    password_encryption = scram-sha-256
    ssl = on
    log_connections = on
    log_disconnections = on
    log_failed_authentications = on
    superuser_reserved_connections = 3
    shared_buffers = 128MB
    work_mem = 4MB

  pg_hba.conf: |
    local   all   all                   trust
    host    all   all   127.0.0.1/32    scram-sha-256
    host    all   all   ::1/128         scram-sha-256
