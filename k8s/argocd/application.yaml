apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartdb-postgres
  namespace: argocd
  labels:
    project: smart-db-guardrail
  annotations:
    ai-validator/status: "pending"
spec:
  project: default

  source:
    repoURL: https://github.com/youssefbj/smart-db-guardrail
    targetRevision: HEAD
    path: k8s/postgres

  destination:
    server: https://kubernetes.default.svc
    namespace: database

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
