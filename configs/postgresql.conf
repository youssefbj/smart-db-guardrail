# Configuration PostgreSQL SÉCURISÉE
# → Le guardrail IA APPROUVERA cette configuration (Score ≥ 70/100)

# Réseau : écoute seulement en local
listen_addresses = 'localhost'
port = 5432
max_connections = 100

# Auth : algorithme fort
password_encryption = scram-sha-256

# Chiffrement : SSL activé
ssl = on

# Logs et audit
log_connections = on
log_disconnections = on
log_failed_authentications = on
log_statement = 'ddl'
log_min_duration_statement = 1000

# Protection
superuser_reserved_connections = 3

# Performance (VM 10GB)
shared_buffers = 128MB
work_mem = 4MB
